name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: albaqiyat-alsalihat/package-lock.json
      - name: Install dependencies
        working-directory: albaqiyat-alsalihat
        run: npm ci
      - name: Build (Pages base path)
        # The base is passed on the CLI so vite.config.ts (and the Capacitor
        # Android build, which serves dist/ from the WebView root) stay untouched.
        working-directory: albaqiyat-alsalihat
        run: npm run build -- --base=/athkar/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: albaqiyat-alsalihat/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
